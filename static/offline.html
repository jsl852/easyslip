<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5f5a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EasySlip" />
    <title>EasySlip is offline</title>
    <style>
      :root { color: #1c1915; background: #f3efe4; font-family: "Figtree", "Avenir Next", "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: calc(1.5rem + env(safe-area-inset-top)) 1.2rem calc(1.5rem + env(safe-area-inset-bottom)); }
      main { max-width: 28rem; }
      h1 { font-family: Palatino, "Palatino Linotype", serif; font-weight: 620; letter-spacing: -0.03em; font-size: 2rem; margin: 0.4rem 0; }
      p { color: #5e584e; line-height: 1.5; }
      button, a { font: inherit; }
      button { display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: 0.6rem 1rem; background: #0f5f5a; color: white; border: 1px solid #0b4541; }
      .mark { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; margin-right: 0.45rem; border: 1.5px solid #0f5f5a; color: #0f5f5a; font-family: Palatino, serif; }
    </style>
  </head>
  <body>
    <main>
      <p><span class="mark">E</span>EasySlip</p>
      <h1>You're offline</h1>
      <p>The app shell is here, but receipts, reports, and the workspace are not saved on this phone. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
